<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soursops Mecopteron</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #060a10; }
  canvas { display: block; position: fixed; inset: 0; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(2,4,8,0.6) 100%);
  }
  #ui {
    position: fixed; top: 22px; left: 0; right: 0; text-align: center;
    pointer-events: none; user-select: none; color: #e2edc9;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #ui h1 {
    font-size: 34px; font-weight: normal; letter-spacing: 8px; text-transform: lowercase;
    text-shadow: 0 0 22px rgba(150,210,90,0.35);
  }
  #ui p {
    margin-top: 8px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: #87987a;
  }
</style>
</head>
<body>
  <div id="ui">
    <h1>Soursops Mecopteron</h1>
    <p>a horticultural calamity &middot; click to plant &middot; s to spawn &middot; r to reset</p>
  </div>
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <script>
    (function () {
      var canvas = document.getElementById('c');
      var ctx = canvas.getContext('2d');
      var W = 0, H = 0, time = 0;

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#060a10';
        ctx.fillRect(0, 0, W, H);
      }
      window.addEventListener('resize', resize);
      resize();

      function rng(seed) {
        var s = seed >>> 0;
        return function () {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      function mixHex(a, b, t) {
        t = Math.max(0, Math.min(1, t));
        var A = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
        var B = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
        return 'rgb(' + A.map(function (v, i) { return Math.round(v + (B[i]-v)*t); }).join(',') + ')';
      }

      // ---------- background motes ----------
      var motes = [];
      (function () {
        for (var i = 0; i < 70; i++) {
          motes.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.4,
                       tw: Math.random()*Math.PI*2, ts: 0.5+Math.random()*1.5 });
        }
      })();

      function drawMotes(dt) {
        for (var i = 0; i < motes.length; i++) {
          var m = motes[i];
          m.tw += m.ts * dt;
          m.y -= 0.35 * dt * 40;
          if (m.y < -4) { m.y = H + 4; }
          m.x += Math.sin(m.tw) * 0.3;
          var a = 0.2 + 0.25 * (0.5 + 0.5 * Math.sin(m.tw));
          ctx.fillStyle = 'rgba(190,220,160,' + a + ')';
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ---------- soursop fruit ----------
      var fruits = [];

      function plant(x, y) {
        var seed = (Math.random() * 1e9) >>> 0;
        var rnd = rng(seed);
        var wob = [];
        var wr = rng((seed + 7919) >>> 0);
        for (var i = 0; i < 48; i++) wob.push(wr() * 2 - 1);
        var spikes = [];
        for (var i = 0; i < 34; i++) spikes.push({ a: i/34*Math.PI*2 + rnd()*0.06, len: 4 + rnd()*6 });
        fruits.push({
          seed: seed, rnd: rnd, x: x, y: y, t: 0,
          growTime: 2.2 + rnd() * 0.8, size: 30 + rnd() * 16,
          state: 'grow', crackAt: 0, wob: wob, spikes: spikes, dead: false
        });
      }

      function updateFruit(f, dt) {
        f.t += dt;
        if (f.state === 'grow' && f.t > f.growTime) { f.state = 'ripe'; f.crackAt = f.t + 1.5 + f.rnd()*2.5; }
        if (f.state === 'ripe' && f.t > f.crackAt) { f.state = 'crack'; }
        if (f.state === 'crack' && f.t > f.crackAt + 0.55) {
          f.state = 'split';
          spawnFly(f.x, f.y, (f.seed ^ 0x9e3779b9) >>> 0);
        }
        if (f.state === 'split' && f.t > f.crackAt + 1.7) { f.dead = true; }
      }

      function drawBody(f, rx, ry, ripe, s) {
        var path = function () {
          ctx.beginPath();
          for (var i = 0; i <= 48; i++) {
            var a = i / 48 * Math.PI * 2;
            var w = f.wob[i % 48] * 0.14;
            var px = Math.cos(a) * rx * (1 + w);
            var py = Math.sin(a) * ry * (1 + w);
            if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
          }
          ctx.closePath();
        };
        var g = ctx.createRadialGradient(-rx*0.4, -ry*0.5, rx*0.2, 0, 0, rx*1.5);
        g.addColorStop(0, mixHex('#5d9c39', '#a3b23f', ripe));
        g.addColorStop(0.6, mixHex('#3c6b24', '#7d7e2a', ripe));
        g.addColorStop(1, mixHex('#2c4f1a', '#5c5a1e', ripe));
        path();
        ctx.fillStyle = g;
        ctx.fill();

        ctx.lineCap = 'round';
        var sp;
        for (var i = 0; i < f.spikes.length; i++) {
          sp = f.spikes[i];
          var ex = Math.cos(sp.a) * rx * (1 + f.wob[Math.floor(sp.a/(Math.PI*2)*48)%48] * 0.14);
          var ey = Math.sin(sp.a) * ry * (1 + f.wob[Math.floor(sp.a/(Math.PI*2)*48)%48] * 0.14);
          var L = sp.len * s * (0.9 + 0.2 * ripe);
          ctx.strokeStyle = mixHex('#3c6b24', '#7d7e2a', ripe);
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(ex, ey);
          ctx.quadraticCurveTo(ex + Math.cos(sp.a)*L*0.5, ey + Math.sin(sp.a)*L*0.35,
                               ex + Math.cos(sp.a)*L, ey + Math.sin(sp.a)*L*0.75);
          ctx.stroke();
          ctx.fillStyle = '#d9d98a';
          ctx.beginPath();
          ctx.arc(ex + Math.cos(sp.a)*L, ey + Math.sin(sp.a)*L*0.75, 1, 0, Math.PI*2);
          ctx.fill();
        }

        ctx.strokeStyle = '#4a6330'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -ry*1.02);
        ctx.quadraticCurveTo(rx*0.1, -ry*1.25, rx*0.08, -ry*1.38);
        ctx.stroke();
        ctx.fillStyle = '#5d8a3a';
        ctx.beginPath();
        ctx.ellipse(rx*0.16, -ry*1.24, rx*0.12, rx*0.05, -0.5, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,220,0.15)';
        ctx.beginPath();
        ctx.ellipse(-rx*0.35, -ry*0.45, rx*0.3, ry*0.18, -0.4, 0, Math.PI*2);
        ctx.fill();
      }

      function drawCrack(f, rx, ry, p) {
        ctx.strokeStyle = '#1a1f12';
        ctx.lineWidth = 2 + p * 6;
        ctx.beginPath();
        var seg = 10;
        for (var i = 0; i <= seg; i++) {
          var yy = -ry + i/seg * ry * 2;
          var x = Math.sin(i*7 + f.seed) * rx * 0.12 * (1 - p);
          if (i) ctx.lineTo(x, yy); else ctx.moveTo(x, yy);
        }
        ctx.stroke();
      }

      function drawHalf(f, side, p, rx, ry, ripe, s) {
        ctx.save();
        ctx.translate(0, p * side * 4);
        ctx.rotate(side * p * 0.6);
        ctx.beginPath();
        if (side < 0) ctx.rect(-rx*1.5, -ry*1.8, rx*1.5, ry*3.6);
        else ctx.rect(-rx*0.05, -ry*1.8, rx*1.55, ry*3.6);
        ctx.clip();
        drawBody(f, rx, ry, ripe, s);
        ctx.restore();
      }

      function drawFruit(f) {
        if (f.state === 'gone') return;
        var grow = Math.min(1, f.t / f.growTime);
        var s = (0.15 + 0.85 * grow) * f.size * (1 + 0.02*Math.sin(f.t*2));
        var ripe = Math.max(0, Math.min(1, (f.t - f.growTime*0.9) / 1.5));
        var crack = f.state === 'crack' ? Math.min(1, (f.t - f.crackAt)/0.55) : (f.state === 'split' ? 1 : 0);
        var rx = s, ry = s * 0.92;

        ctx.save();
        ctx.translate(f.x, f.y);
        if (crack > 0 && crack < 1) ctx.rotate(Math.sin(f.t*70) * 2.5 * (1-crack) * 0.03);

        if (f.state === 'split') {
          var p = Math.min(1, (f.t - f.crackAt - 0.55) / 1.0);
          ctx.globalAlpha = Math.max(0, 1 - p * 1.2);
          drawHalf(f, -1, p, rx, ry, ripe, s);
          drawHalf(f, 1, p, rx, ry, ripe, s);
        } else {
          drawBody(f, rx, ry, ripe, s);
          if (crack > 0) drawCrack(f, rx, ry, crack);
        }
        ctx.restore();
      }

      // ---------- scorpionfly ----------
      var flies = [];

      function spawnFly(x, y, seed) {
        var rnd = rng(seed);
        flies.push({
          x: x, y: y, px: x, py: y, seed: seed, rnd: rnd,
          vx: (rnd()-0.5)*2, vy: (rnd()-0.5)*2 - 1.5,
          flap: rnd()*Math.PI*2, flapSpeed: 13 + rnd()*6,
          size: 0.8 + rnd()*0.5,
          wing: [rnd(), rnd(), rnd(), rnd()]
        });
      }

      function updateFly(f, dt) {
        var h = Math.sin(f.x*0.006 + time*0.5 + f.seed*7) * 1.5
              + Math.cos(f.y*0.004 - time*0.4 + f.seed*3) * 1.0;
        var ang = Math.atan2(f.vy, f.vx);
        var d = Math.atan2(Math.sin(h - ang), Math.cos(h - ang));
        ang += d * Math.min(1, dt * 1.2);
        var sp = 46 + 34 * Math.sin(time*0.35 + f.seed*13);
        f.vx = Math.cos(ang) * sp;
        f.vy = Math.sin(ang) * sp;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.flap += f.flapSpeed * dt;
        var m = 80;
        if (f.x < -m) f.x = W + m; if (f.x > W + m) f.x = -m;
        if (f.y < -m) f.y = H + m; if (f.y > H + m) f.y = -m;
      }

      function drawWing(f, yScale, far, len) {
        var sc = Math.abs(yScale) < 0.12 ? 0.12 * (yScale < 0 ? -1 : 1) : yScale;
        var w = f.wing;
        ctx.save();
        ctx.scale(1, sc);
        ctx.fillStyle = far ? 'rgba(150,210,190,0.16)' : 'rgba(190,255,220,0.28)';
        ctx.strokeStyle = far ? 'rgba(150,220,200,0.30)' : 'rgba(215,255,235,0.55)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(len*0.26, -len*0.78, len*0.62, -len*(0.5 + w[0]*0.5), len*(0.9 + w[1]*0.14), -len*0.18);
        ctx.bezierCurveTo(len*0.72, len*0.06, len*0.34, len*0.14, 0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(len*0.5, -len*0.5);
        ctx.moveTo(0, 0); ctx.lineTo(len*0.78, -len*0.2);
        ctx.stroke();
        ctx.restore();
      }

      function tail(f, len) {
        ctx.strokeStyle = '#26303c';
        ctx.lineWidth = 2.2 * f.size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-len*0.4, 0);
        ctx.bezierCurveTo(-len*0.62, len*0.02, -len*0.7, -len*0.16, -len*0.62, -len*0.32);
        ctx.bezierCurveTo(-len*0.55, -len*0.46, -len*0.32, -len*0.5, -len*0.18, -len*0.44);
        ctx.stroke();
        ctx.fillStyle = '#0f1318';
        ctx.beginPath();
        var sx = -len*0.16, sy = -len*0.46;
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + len*0.08, sy - len*0.02);
        ctx.lineTo(sx - len*0.04, sy - len*0.05);
        ctx.closePath();
        ctx.fill();
      }

      function drawFly(f) {
        var ang = Math.atan2(f.vy, f.vx);
        var len = 30 * f.size;
        var fl = Math.sin(f.flap);

        ctx.save();
        ctx.translate(f.x, f.y);

        // soft glow
        ctx.fillStyle = 'rgba(160,220,190,0.05)';
        ctx.beginPath();
        ctx.arc(0, 0, len * 1.6, 0, Math.PI*2);
        ctx.fill();

        ctx.rotate(ang);

        // wings (behind body)
        ctx.save(); ctx.translate(len*0.22, -len*0.05);
        drawWing(f, -fl, true, len*0.9);
        drawWing(f, fl, false, len);
        ctx.restore();
        ctx.save(); ctx.translate(-len*0.2, -len*0.03);
        drawWing(f, -fl*0.85, true, len*0.6);
        drawWing(f, fl*0.85, false, len*0.65);
        ctx.restore();

        tail(f, len);

        ctx.save();
        // thorax
        var g = ctx.createLinearGradient(len*0.1, 0, len*0.45, 0);
        g.addColorStop(0, '#46586b'); g.addColorStop(1, '#8a9aa8');
        ctx.shadowColor = 'rgba(160,220,190,0.45)';
        ctx.shadowBlur = 14;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(len*0.3, 0, len*0.2, len*0.1, 0, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        // abdomen
        ctx.fillStyle = '#2b3645';
        ctx.beginPath(); ctx.ellipse(-len*0.22, 0, len*0.23, len*0.09, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
        for (var i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(-len*(0.08 + i*0.1), -len*0.08);
          ctx.lineTo(-len*(0.08 + i*0.1), len*0.08);
          ctx.stroke();
        }
        // head
        ctx.fillStyle = '#1c2430';
        ctx.beginPath(); ctx.ellipse(len*0.52, 0, len*0.09, len*0.07, 0, 0, Math.PI*2); ctx.fill();
        // eyes
        ctx.fillStyle = '#b7ffd8';
        ctx.beginPath();
        ctx.arc(len*0.56, -len*0.03, len*0.022, 0, Math.PI*2);
        ctx.arc(len*0.56, len*0.03, len*0.022, 0, Math.PI*2);
        ctx.fill();
        // antennae
        ctx.strokeStyle = '#9db0b8'; ctx.lineWidth = 0.7;
        for (var s = -1; s <= 1; s += 2) {
          ctx.beginPath();
          ctx.moveTo(len*0.57, 0);
          ctx.quadraticCurveTo(len*0.68, s*len*0.16, len*(0.72 + 0.1*Math.sin(time*3 + f.seed + s)), s*len*0.28);
          ctx.stroke();
        }
        // legs
        ctx.strokeStyle = '#39454f'; ctx.lineWidth = 0.8;
        for (var i = 0; i < 6; i++) {
          var base = -len*0.12 + i*len*0.13;
          ctx.beginPath();
          ctx.moveTo(base, 0);
          ctx.lineTo(base + len*0.04, len*0.12);
          ctx.lineTo(base + len*0.02, len*0.2);
          ctx.stroke();
        }
        ctx.restore();
        ctx.restore();
      }

      // ---------- main loop ----------
      var last = performance.now();

      function frame(now) {
        var dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        time += dt;

        ctx.fillStyle = 'rgba(6,10,16,0.14)';
        ctx.fillRect(0, 0, W, H);

        drawMotes(dt);

        for (var i = 0; i < fruits.length; i++) {
          updateFruit(fruits[i], dt);
          drawFruit(fruits[i]);
        }
        for (var i = 0; i < fruits.length; i++) {
          if (fruits[i].dead) { fruits.splice(i, 1); i--; }
        }

        ctx.strokeStyle = 'rgba(180,240,205,0.08)';
        ctx.lineWidth = 1;
        for (var i = 0; i < flies.length; i++) {
          var f = flies[i];
          ctx.beginPath();
          ctx.moveTo(f.px, f.py);
          ctx.lineTo(f.x, f.y);
          ctx.stroke();
          f.px = f.x; f.py = f.y;
        }
        for (var i = 0; i < flies.length; i++) {
          updateFly(flies[i], dt);
          drawFly(flies[i]);
        }

        requestAnimationFrame(frame);
      }

      // ---------- input ----------
      canvas.addEventListener('click', function (e) {
        plant(e.clientX, e.clientY);
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === 's' || e.key === 'S') {
          spawnFly(Math.random()*W, Math.random()*H, (Math.random()*1e9) >>> 0);
        }
        if (e.key === 'r' || e.key === 'R') {
          fruits = []; flies = [];
          plant(W*0.4, H*0.6);
          plant(W*0.62, H*0.66);
        }
      });

      plant(W*0.4, H*0.6);
      plant(W*0.62, H*0.66);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
